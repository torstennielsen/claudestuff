<!DOCTYPE html>
<html lang='da'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Del artikel - Demo</title>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css'>
<style>
  body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 28px; border: none; border-radius: 999px; background-color: #1e3932; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; min-width: 180px; min-height: 52px; }
  .btn:hover { background-color: #16302a; }
  .share-wrapper { position: relative; display: inline-block; }
  .share-label { display: inline-flex; align-items: center; gap: 10px; }
  .share-icons { display: none; align-items: center; gap: 16px; font-size: 20px; }
  @media (hover: hover) and (pointer: fine) {
    .share-wrapper:hover .share-label { display: none; }
    .share-wrapper:hover .share-icons { display: inline-flex; }
  }
  .share-icons a { color: #fff; text-decoration: none; transition: opacity 0.15s; }
  .share-icons a:hover { opacity: 0.75; }
  .copy-feedback { position: absolute; bottom: -36px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 6px; white-space: nowrap; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .copy-feedback.show { opacity: 1; }
  p { color: #555; margin-top: 48px; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class='share-wrapper'>
  <button class='btn' id='shareBtn' aria-label='Del artikel'>
    <span class='share-label'>Del artikel <i class='fa fa-thin fa-share-from-square'></i></span>
    <span class='share-icons'>
      <a href='#' id='fbLink' title='Del paa Facebook'><i class='fa-brands fa-facebook'></i></a>
      <a href='#' id='mailLink' title='Del via e-mail'><i class='fa-solid fa-envelope'></i></a>
      <a href='#' id='copyLink' title='Kopier link'><i class='fa-solid fa-copy'></i></a>
    </span>
  </button>
  <span class='copy-feedback' id='copyFeedback'>Link kopieret!</span>
</div>
<p>Desktop: hover over knappen for at se delemulighederne<br>Mobil: tryk for native share</p>
<script>
  const SHARE_URL = window.location.href;
  const SHARE_TITLE = document.title;
  const fbLink = document.getElementById('fbLink');
  const mailLink = document.getElementById('mailLink');
  const copyLink = document.getElementById('copyLink');
  const copyFeedback = document.getElementById('copyFeedback');
  const shareBtn = document.getElementById('shareBtn');
  fbLink.addEventListener('click', e => { e.preventDefault(); window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(SHARE_URL),'_blank','width=600,height=400'); });
  mailLink.addEventListener('click', e => { e.preventDefault(); window.location.href='mailto:?subject='+encodeURIComponent(SHARE_TITLE)+'&body='+encodeURIComponent(SHARE_URL); });
  copyLink.addEventListener('click', e => { e.preventDefault(); navigator.clipboard.writeText(SHARE_URL).then(()=>{ copyFeedback.classList.add('show'); setTimeout(()=>copyFeedback.classList.remove('show'),2000); }); });
  if (window.matchMedia('(hover: none) and (pointer: coarse)').matches && navigator.share) {
    shareBtn.addEventListener('click', () => navigator.share({title:SHARE_TITLE,url:SHARE_URL}).catch(()=>{}));
  }
</script>
</body>
</html>
